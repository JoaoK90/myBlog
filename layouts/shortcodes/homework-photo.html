{{- $sources := slice (.Get "src") (.Get "src2") -}}
<figure class="homework-photo">
  <div class="homework-photo-grid">
    {{- range $index, $source := $sources -}}
      {{- with $source -}}
        {{- $resource := $.Page.Resources.GetMatch . -}}
        {{- if not $resource -}}
          {{- errorf "Missing post image %q in %s" . $.Page.File.Path -}}
        {{- else -}}
          {{- $alt := $.Get "alt" -}}
          {{- if eq $index 1 -}}{{- $alt = $.Get "alt2" -}}{{- end -}}
          <a class="homework-photo-link" href="{{ $resource.RelPermalink }}" target="_blank" rel="noopener" title="Open full-size image" aria-label="Open full-size image: {{ $alt }}">
            <img src="{{ $resource.RelPermalink }}" alt="{{ $alt }}" loading="lazy" width="{{ $resource.Width }}" height="{{ $resource.Height }}">
          </a>
        {{- end -}}
      {{- end -}}
    {{- end -}}
  </div>
  {{- with .Get "caption" -}}
    <figcaption>{{ . | markdownify }}</figcaption>
  {{- end -}}
</figure>
